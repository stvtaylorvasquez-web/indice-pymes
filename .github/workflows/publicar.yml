# Publica el sitio en GitHub Pages cada vez que cambia algo dentro de sitio/
# Requisito único: en GitHub > Settings > Pages > Source, elegir "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
    paths: ["sitio/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32
      - name: Renderizar el tablero
        run: quarto render sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
